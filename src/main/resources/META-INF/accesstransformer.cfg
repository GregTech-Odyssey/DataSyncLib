# Access transformer for the 1.21.1 / NeoForge line.
#
# NeoForge resolves access transformers against the official (Mojang) names, not the SRG names the
# 1.20.1/Forge line used, so these are plain field/constructor names.
#
# Only NbtUtil needs widened access, and only for the two members it cannot reach publicly:
#   - CompoundTag#tags (private final Map<String, Tag>): exposed as a live Map through
#     NbtUtil.COMPOUND_TAG_MAP, used by @Conversion-managed CompoundTag fields. Without it the
#     map would have to be rebuilt/wrapped on every access.
#   - ListTag(List, byte) (package-private): the typed constructor, so a converted list is handed
#     over as-is instead of re-adding every element through the public API.
#
# ModDevGradle picks up src/main/resources/META-INF/accesstransformer.cfg automatically.
public net.minecraft.nbt.CompoundTag tags
public net.minecraft.nbt.ListTag <init>(Ljava/util/List;B)V
