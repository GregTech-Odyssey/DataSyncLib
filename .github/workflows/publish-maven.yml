name: Publish Maven

on:
  push:
    branches: [1.20.1]
  workflow_dispatch:

concurrency:
  group: publish-maven
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    uses: GregTech-Odyssey/GradlePublishPlugin/.github/workflows/maven-publish.yml@main
    secrets: inherit
